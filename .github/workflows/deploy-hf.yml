name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF Spaces
        run: |
          git remote add hf https://Cube86634654:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Cube86634654/clipping
          git push hf main:main --force
